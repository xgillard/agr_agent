[project]
name = "agr_agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.10.18"
dependencies    = [
    # Build utils
    "setuptools>=80.9.0",
    "wheel>=0.45.1",

    # Torch
    "torch>=2.9.0",

    # Huggingface
    "accelerate>=1.11.0",
    "transformers>=4.57.1",
    "sentence-transformers>=5.1.2",

    # Langchain
    "langchain>=0.3.27",
    "langchain-core>=0.3.79",
    "langchain-docling>=1.1.0",
    "langchain-text-splitters>=0.3.11",
    "langchain-chroma>=0.2.6",
    "langchain-huggingface>=0.3.1",
    "langchain-ollama>=0.3.10",
    "langchain-mistralai>=0.2.12",
    "langchain-google-genai>=2.1.12",
    "langchain-openai>=0.3.35",
    
    # Langgraph
    "langgraph>=1.0.1",
    "agentevals>=0.0.9",
    
    # Other utilities
    "python-dotenv>=1.2.1",
    "streamlit>=1.50.0",
    "scikit-learn>=1.7.2",
    "textdistance>=4.6.3",
    "html5lib>=1.1",
    "pyarrow>=22.0.0",
]

[dependency-groups]
dev = [
    # Quality Assurance
    "mypy>=1.18.2",
    "ruff>=0.14.3",
    "types-requests>=2.32.4.20250913",
    "pytest>=8.4.2",
    "behave>=1.3.3",

    # Exploration
    "jupyter-lsp>=2.3.0",
    "python-lsp-server>=1.13.1",
    "matplotlib>=3.10.7",
    "umap-learn>=0.5.9.post2",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.ruff]
line-length = 120
lint.select = ["E", "F", "I"]
exclude = ["./corpus"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
addopts = "--doctest-modules --ignore=.ipynb_checkpoints/ --ignore=plot_graph.py"
norecursedirs = "venv .venv"
