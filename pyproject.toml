[project]
name = "agr_agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies    = [
    "agentevals>=0.0.8",
    "langchain-chroma>=0.2.4",
    "langchain-docling>=1.0.0",
    "langchain-google-genai>=2.1.7",
    "langchain-huggingface>=0.3.0",
    "langchain-text-splitters>=0.3.8",
    "langgraph>=0.5.2",
    "langgraph-supervisor>=0.0.27",
    "langmem>=0.0.28",
    "pysolr>=3.10.0",
    "sentence-transformers>=5.0.0",
    "python-dotenv>=1.1.1",
    "langchain-ollama>=0.3.4",
    "accelerate>=1.9.0",
    "scikit-learn>=1.7.0",
    "pyarrow>=21.0.0",
    "torch>=2.8.0",
    "html5lib>=1.1",
    "textdistance>=4.6.3",
]

[dependency-groups]
dev = [
    "behave>=1.3.2",
    "jupyter-lsp>=2.3.0",
    "matplotlib>=3.10.5",
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "python-lsp-server>=1.13.1",
    "ruff>=0.12.11",
    "types-requests>=2.32.4.20250809",
    "umap-learn>=0.5.9.post2",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.ruff]
line-length = 120
lint.select = ["E", "F", "I"]
exclude = ["./corpus"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
addopts = "--doctest-modules --ignore=.ipynb_checkpoints/ --ignore=main.py --ignore=agents/customer_support.py"
norecursedirs = "venv .venv"