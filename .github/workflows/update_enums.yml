# .github/workflows/update_enums.yml

name: Update AGATHA enums

on:
  # manual launch
  workflow_dispatch:
  # Exécute l'action tous les lundis à 5h du matin (format cron)
  schedule:
    - cron: '0 5 * * 1'

jobs:
  update-enums:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: "Install uv"
        uses: astral-sh/setup-uv@v6

      - name: "Sync dependencies"
        run: uv sync

      - name: "Regenerate enums"
        run: uv run -m tools.agatha2enum

      - name: "Create PR if somehting changed"
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Autmatic PR creation upon agatha enum update"
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Automatic update of the generated AGATHA enums"
          body: |
            This PR is created because a change has been detected in the code generated
            for the AGATHA enums.
          branch: "chore/update-agatha-enums" 
          delete-branch: true
          labels: "autogenerated, dependencies"