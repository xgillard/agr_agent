name: Mypy checks
on: [push, pull_request]
jobs:
  run-mypy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: "Install uv"
        uses: astral-sh/setup-uv@v6

      - name: "Install mypy and dependencies"
        run: uv sync

      - name: "Run mypy"
        run: uv run mypy .
